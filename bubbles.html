<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f5f0">
  <meta name="description" content="A tiny, original bubble-battle game. Take a little break.">
  <title>Bubble break</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='16' fill='%2376b8b2'/%3E%3Ccircle cx='15' cy='14' r='4' fill='white' opacity='.7'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="bubbles.css?v=4">
  <script src="theme.js?v=20261030-shared"></script>
  <script type="module" src="bubbles.js?v=4"></script>
</head>
<body>
  <header class="game-header"><a href="index.html">Home</a></header>
  <main>
    <div class="game-heading"><h1>Bubble break</h1></div>
    <section class="game" aria-label="Bubble battle game">
      <div class="scorebar"><div class="player-label"><i></i>You <span id="status-label"></span></div><div class="game-tools"><span id="clock" aria-label="Time remaining">2:30</span><button id="pause" type="button" disabled>Pause</button><button id="sound" type="button" aria-pressed="false">Sound off</button></div></div>
      <div class="arena">
        <canvas id="board" width="780" height="660" tabindex="0" aria-label="Bubble arena. Move with arrow keys or W A S D. Space places a bubble; tap Space repeatedly to escape if trapped. P pauses."></canvas>
        <div class="overlay" id="overlay"><div class="overlay-card"><h2 id="overlay-title" hidden></h2><p id="overlay-copy">Outlast two opponents. You’re teal.</p><button id="play" type="button">Play</button></div></div>
      </div>
      <div class="game-bottom"><span id="power">Bubbles 1 · Reach 2</span><span id="feedback" role="status" aria-live="polite"></span></div>
    </section>
    <div class="touch-controls" aria-label="Touch controls"><div class="dpad"><button data-dir="up" aria-label="Move up">W</button><button data-dir="left" aria-label="Move left">A</button><button data-dir="down" aria-label="Move down">S</button><button data-dir="right" aria-label="Move right">D</button></div><button id="drop" type="button">Bubble</button></div>
    <div class="instructions"><p class="key-guide"><span>WASD / arrows to move</span><span>Space to place</span><span>P to pause</span></p><p>Bubbles burst after 2.2s. Trapped? Tap Space or Bubble four times to escape.</p></div>
  </main>
  <footer><button id="restart" type="button">Restart</button></footer>
</body>
</html>
