<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111a22"><title>Crossline</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%2368b9ae' stroke-width='2'/%3E%3Cpath d='M16 2v8m0 12v8M2 16h8m12 0h8' stroke='%2368b9ae' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="arena.css?v=1"><script type="module" src="arena.js?v=4"></script>
</head>
<body>
  <main id="viewport" aria-label="First-person arena">
    <canvas id="scene" tabindex="0" aria-label="Crossline. W A S D to move, mouse to aim, click to fire, R to reload, 1 2 3 to switch weapons, Space to jump, Shift to dash, Escape to pause."></canvas>
    <div id="damage" aria-hidden="true"></div>
    <header><a href="index.html">Home</a><span>Crossline</span><div><button id="sound" type="button" aria-pressed="true">Sound on</button><button id="pause" type="button" disabled>Pause</button></div></header>
    <div class="top-status" id="top-status"><span id="wave">Wave 1</span><span id="remaining">3:00</span><span id="score">0</span></div>
    <div id="crosshair" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div>
    <div id="hit" aria-hidden="true"></div>
    <div id="notice" role="status" aria-live="polite"></div>
    <div class="hud"><div class="health"><span id="health">100</span><div><small>HEALTH</small><div class="health-track"><i id="health-bar"></i></div></div></div><div class="weapon"><small id="weapon-name">SIDEARM</small><div><span id="ammo">12</span><small id="magazine">/ 12</small></div><span id="reload-status"></span></div></div>
    <div class="weapon-keys"><span data-weapon="0" class="selected">1 Sidearm</span><span data-weapon="1">2 Scatter</span><span data-weapon="2">3 Pulse</span></div>
    <section class="overlay" id="overlay" aria-labelledby="overlay-title"><div class="menu">
      <h1 id="overlay-title">Crossline</h1><p id="overlay-copy">Survive three minutes.</p>
      <button id="start" type="button" disabled>Loading</button>
      <p id="device-note" hidden>A keyboard and mouse are required.</p>
      <div class="controls"><span><kbd>WASD</kbd> Move</span><span><kbd>Mouse</kbd> Aim & fire</span><span><kbd>R</kbd> Reload</span><span><kbd>1 2 3</kbd> Weapons</span><span><kbd>Space</kbd> Jump</span><span><kbd>Shift</kbd> Dash</span></div>
      <p class="menu-note">Click to capture the mouse. Esc pauses and releases it.</p>
      <button id="restart" type="button" hidden>New round</button>
    </div></section>
  </main>
</body>
</html>
